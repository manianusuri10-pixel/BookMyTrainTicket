<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookMyTrainTicket</title>
<style>
body{margin:0;font-family:Arial;background:#07111f;color:#f5f7fb}header{padding:20px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #263952}.logo{font-size:25px;font-weight:800}.logo span{color:#27a7ff}button{padding:11px 17px;border:0;border-radius:9px;background:#27a7ff;color:#fff;font-weight:700;cursor:pointer;margin:4px}.secondary{background:#263952}.container{width:min(1050px,92%);margin:35px auto}.card{background:#0d1929;border:1px solid #263952;border-radius:16px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}input,select{width:100%;padding:12px;box-sizing:border-box;background:#081525;color:white;border:1px solid #263952;border-radius:9px}label{display:block;color:#a9b7ca;font-size:13px;margin-bottom:6px}.hidden{display:none}.msg{margin-top:12px;padding:12px;background:#13243a;border-radius:9px;color:#a9b7ca}.train{margin-top:12px;padding:17px;border:1px solid #263952;border-radius:12px}.meta{color:#a9b7ca;line-height:1.7}.seat{display:inline-block;padding:8px;margin:4px;border-radius:7px;border:1px solid #263952}.available{background:#102c28;cursor:pointer}.selected{background:#27a7ff}.unavailable{opacity:.35}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #263952;text-align:left}footer{text-align:center;padding:30px;color:#a9b7ca}
</style></head>
<body><header><div class="logo">BookMy<span>Train</span>Ticket</div><div><button class="secondary" onclick="show('login')">Login</button><button onclick="show('register')">Register</button></div></header>
<main class="container"><div class="card"><h1>Book your train journey</h1><p style="color:#a9b7ca">Search trains, select seats and manage bookings with Aiven MySQL.</p><button onclick="show('search')">Search Trains</button><button class="secondary" onclick="loadBookings()">My Bookings</button></div>
<section id="login" class="card hidden"><h2>Login</h2><div class="grid"><div><label>Username</label><input id="loginUser"></div><div><label>Password</label><input id="loginPass" type="password"></div></div><br><button onclick="login()">Login</button><div id="loginMsg"></div></section>
<section id="register" class="card hidden"><h2>Register</h2><div class="grid"><div><label>Username</label><input id="regUser"></div><div><label>Password</label><input id="regPass" type="password"></div><div><label>Email</label><input id="regEmail" type="email"></div><div><label>Role</label><select id="regRole"><option>Regular</option><option>Senior</option><option>DifferentlyAbled</option></select></div></div><br><button onclick="register()">Register</button><div id="regMsg"></div></section>
<section id="search" class="card"><h2>Search Trains</h2><div class="grid"><div><label>From</label><input id="from" value="New Delhi"></div><div><label>To</label><input id="to" value="Mumbai Central"></div></div><br><button onclick="searchTrains()">Search</button><div id="results"></div></section>
<section id="booking" class="card hidden"><h2>Book Ticket</h2><div id="bookingInfo"></div><div class="grid"><div><label>Passenger Name</label><input id="passengerName"></div><div><label>Passenger Age</label><input id="passengerAge" type="number"></div></div><h3>Select Seat</h3><div id="seats"></div><br><button onclick="book()">Confirm Booking</button><div id="bookMsg"></div></section>
<section id="bookings" class="card hidden"><h2>My Bookings</h2><div id="bookingList"></div></section></main><footer>BookMyTrainTicket © 2026</footer>
<script>
let user=JSON.parse(localStorage.getItem('bmtUser')||'null'),selected=null,currentTrain=null,currentRoute=null;
function show(id){document.querySelectorAll('section.card').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function msg(id,t){document.getElementById(id).innerHTML='<div class="msg">'+t+'</div>'}
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({message:'Invalid server response'}));if(!r.ok)throw Error(d.message||'Request failed');return d}
async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:loginUser.value,password:loginPass.value})});user=d;localStorage.setItem('bmtUser',JSON.stringify(d));msg('loginMsg','Login successful.');show('search')}catch(e){msg('loginMsg',e.message)}}
async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:regUser.value,password:regPass.value,email:regEmail.value,role:regRole.value})});msg('regMsg',d.message)}catch(e){msg('regMsg',e.message)}}
async function searchTrains(){results.innerHTML='<div class="msg">Searching...</div>';try{let a=await api('/api/trains/search?source='+encodeURIComponent(from.value)+'&destination='+encodeURIComponent(to.value));results.innerHTML=a.length?a.map(x=>'<div class="train"><h3>'+x.train.trainName+' ('+x.train.trainNumber+')</h3><div class="meta">'+x.route.sourceStation+' → '+x.route.destinationStation+'<br>Departure: '+x.route.departureTime+' | Arrival: '+x.route.arrivalTime+'<br>Fare: ₹'+x.route.price+' | Available: '+x.availableSeats+'</div><button onclick="openBooking('+x.train.trainId+','+x.route.routeId+')">Select Seat</button></div>').join(''):'<div class="msg">No trains found.</div>'}catch(e){results.innerHTML='<div class="msg">'+e.message+'</div>'}}
async function openBooking(t,r){if(!user){show('login');msg('loginMsg','Please login before booking.');return}currentTrain=t;currentRoute=r;selected=null;show('booking');try{let a=await api('/api/trains/'+t+'/seats');seats.innerHTML=a.map(s=>'<span class="seat '+(s.available?'available':'unavailable')+'" '+(s.available?'onclick="selectSeat(this,'+s.seatId+')"':'')+'>'+s.compartmentName+'-'+s.seatNumber+'<br><small>'+s.berthType+'</small></span>').join('')}catch(e){seats.innerHTML='<div class="msg">'+e.message+'</div>'}}
function selectSeat(el,id){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=id}
async function book(){if(!selected){msg('bookMsg','Select a seat.');return}try{let d=await api('/api/bookings',{method:'POST',body:JSON.stringify({userId:user.userId,seatId:selected,trainId:currentTrain,routeId:currentRoute,passengerName:passengerName.value,passengerAge:Number(passengerAge.value)})});msg('bookMsg',d.message+' Booking ID: '+d.id)}catch(e){msg('bookMsg',e.message)}}
async function loadBookings(){if(!user){show('login');msg('loginMsg','Please login first.');return}show('bookings');try{let a=await api('/api/bookings/user/'+user.userId);bookingList.innerHTML=a.length?'<table><tr><th>Train</th><th>Route</th><th>Passenger</th><th>Status</th></tr>'+a.map(b=>'<tr><td>'+b.trainName+'<br>'+b.trainNumber+'</td><td>'+b.sourceStation+' → '+b.destinationStation+'</td><td>'+b.passengerName+'</td><td>'+b.status+'</td></tr>').join('')+'</table>':'<div class="msg">No bookings yet.</div>'}catch(e){bookingList.innerHTML='<div class="msg">'+e.message+'</div>'}}
</script></body></html>
